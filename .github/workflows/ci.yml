name: Brother Protocol CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  contracts:
    name: Cairo Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.11.4"
          scarb-lock: contracts/brotherdomain/Scarb.lock
      - name: Install Starknet Foundry
        # v4 currently resolves the latest release even when 0.45.0 is requested.
        # v3 preserves the compiler/test toolchain used for the deployed class.
        uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: "0.45.0"
      - name: Build Contracts
        run: |
          cd contracts/brotherdomain
          scarb build
      - name: Run Cairo Tests
        run: |
          cd contracts/brotherdomain
          snforge test

  frontend:
    name: Frontend Client & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build Client
        run: |
          cd client1
          npm ci || npm install
          npm run build

  sdk:
    name: TypeScript Developer SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build & Test SDK
        run: |
          cd sdk
          npm ci || npm install
          npm run build
          npm test

  resolver:
    name: Resolver API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test Resolver API
        run: |
          cd solver-service
          npm ci || npm install
          npm test
